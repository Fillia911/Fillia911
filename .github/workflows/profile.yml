name: Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Fillia911
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e34c26&color_dots=#161b22,#2d1f5e,#4a2fa0,#6b42d4,#865af5&color_background=#aaaaaa
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
